name: Update LinkedIn preview image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/remove-preview-phone.py'

permissions:
  contents: write

jobs:
  remove-phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.1.0
      - run: python scripts/remove-preview-phone.py
      - name: Commit preview image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/og-image.png
          git diff --cached --quiet || (git commit -m "Remove phone illustration from LinkedIn preview" && git push)
